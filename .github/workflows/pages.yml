# Publish RayMan on GitHub Pages: every push to main deploys a copy of the app without the
# development files, with asset links stamped (tools/stamp-assets.py) so no browser keeps old scripts.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the app
        run: |
          rsync -a --exclude='.git*' --exclude='.github' --exclude='*.sh' --exclude='Claude' \
            --exclude='CLAUDE.md' --exclude='TODO.md' --exclude='tests' --exclude='tools' \
            --exclude='_site' ./ _site/
          python3 tools/stamp-assets.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
